# Left half only. lily58_left is the central half
# (SHIELD_LILY58_LEFT sets ZMK_SPLIT_ROLE_CENTRAL), which is where
# ZMK_STUDIO selects ZMK_STUDIO_RPC. Shared settings live in lily58.conf.

# ZMK Studio. The studio-rpc-usb-uart snippet in build.yaml supplies the
# transport; this Kconfig is what actually enables the feature. Unlock
# with &studio_unlock: hold L1+L2 (or R1+R2) a moment, then press G;
# or hold R2 and press the number-row key above Q.
CONFIG_ZMK_STUDIO=y
