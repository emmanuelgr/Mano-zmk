# Enable mouse / pointing support
CONFIG_ZMK_POINTING=y

# Optional: higher-resolution scrolling, for finer &msc steps
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Move/scroll step size is no longer Kconfig. To change it, #define
# ZMK_POINTING_DEFAULT_MOVE_VAL / ZMK_POINTING_DEFAULT_SCRL_VAL in the
# keymap before including <dt-bindings/zmk/pointing.h>.

# Uncomment the following lines to enable logging for debugging
# CONFIG_ZMK_USB_LOGGING=y
