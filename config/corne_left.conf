# Enable mouse / pointing support
CONFIG_ZMK_POINTING=y

# ZMK Studio. Only needed on the central half (left); the
# studio-rpc-usb-uart snippet in build.yaml supplies the transport, and
# this Kconfig is what actually enables the feature. Unlock with the
# &studio_unlock key on the SYS layer (hold an outer thumb).
CONFIG_ZMK_STUDIO=y

# Optional: higher-resolution scrolling, for finer &msc steps
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Move/scroll step size is no longer Kconfig. To change it, #define
# ZMK_POINTING_DEFAULT_MOVE_VAL / ZMK_POINTING_DEFAULT_SCRL_VAL in the
# keymap before including <dt-bindings/zmk/pointing.h>.

# Uncomment the following lines to enable logging for debugging
# CONFIG_ZMK_USB_LOGGING=y
